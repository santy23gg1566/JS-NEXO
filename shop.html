<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIMÓ® | Shop de relojes</title><style>
:root{color-scheme:dark;font-family:Inter,system-ui,Arial,sans-serif;background:#101114;color:#f7f7f7}*{box-sizing:border-box}body{margin:0}header{position:sticky;top:0;z-index:5;background:#141519ed;backdrop-filter:blur(16px);border-bottom:1px solid #303035;padding:17px max(22px,5vw);display:flex;justify-content:space-between;align-items:center;gap:15px}a{color:inherit;text-decoration:none}.brand{font-weight:900;letter-spacing:-2px;font-size:27px}.brand span{color:#c9ff63}.back{font-size:13px;color:#c9ff63}.wrap{max-width:1260px;margin:auto;padding:70px 22px}.eyebrow{color:#c9ff63;letter-spacing:3px;font-size:12px;font-weight:700}h1{font-size:clamp(50px,8vw,100px);line-height:.95;letter-spacing:-5px;margin:18px 0 20px}.intro{color:#b7b7bb;max-width:600px;line-height:1.7}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:38px 0 30px}input,select{background:#1d1f24;color:white;border:1px solid #383a40;border-radius:12px;padding:15px;font:inherit}input{flex:1;min-width:210px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:20px}.product{background:#1b1c20;border:1px solid #33343a;border-radius:20px;overflow:hidden;transition:transform .2s,border-color .2s}.product:hover{transform:translateY(-5px);border-color:#c9ff63}.product img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block}.content{padding:19px}.category{font-size:11px;letter-spacing:1.8px;color:#c9ff63;text-transform:uppercase}.content h2{font-size:20px;line-height:1.2;margin:12px 0}.content p{color:#b6b6bb;font-size:13px;line-height:1.65;min-height:84px}.bottom{display:flex;justify-content:space-between;align-items:center;gap:8px}.available{font-size:12px;color:#c9ff63}.details{border:1px solid #666;border-radius:9px;padding:10px 13px;background:transparent;color:white;cursor:pointer}dialog{border:1px solid #555;background:#191a1f;color:white;border-radius:22px;max-width:700px;width:calc(100% - 25px);padding:0}dialog::backdrop{background:#000b}.modal{display:grid;grid-template-columns:1fr 1fr}.modal img{width:100%;height:100%;object-fit:cover}.modal-copy{padding:25px}.close{float:right;background:#333;border:0;border-radius:8px;color:white;padding:8px 12px;cursor:pointer}.muted{color:#bcbcc1;line-height:1.7}footer{padding:40px;text-align:center;color:#888;border-top:1px solid #333}@media(max-width:560px){.modal{display:block}.modal img{max-height:340px;object-fit:contain}.wrap{padding-top:45px}h1{letter-spacing:-3px}}
</style></head><body><header><a class="brand" href="index.html">SIMÓ<span>®</span></a><a class="back" href="index.html">← VOLVER AL PORTAFOLIO</a></header><main class="wrap"><div class="eyebrow">COLECCIÓN / RELOJES</div><h1>EL TIEMPO<br>TIENE ESTILO.</h1><p class="intro">Descubre nuestra selección de relojes. Diseños deportivos, clásicos y modernos para destacar en cada momento.</p><div class="toolbar"><input id="search" placeholder="Buscar reloj por nombre…" aria-label="Buscar relojes"><select id="filter" aria-label="Filtrar por estilo"><option value="">Todos los estilos</option><option>Deportivo</option><option>Clásico</option></select></div><div id="grid" class="grid"></div><p id="empty" hidden>No se encontraron relojes.</p></main><dialog id="dialog"><div id="modal"></div></dialog><footer>SIMÓ® SHOP · Santo Domingo, República Dominicana</footer><script>
let products=[];const grid=document.getElementById('grid'),dialog=document.getElementById('dialog');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function draw(){const q=document.getElementById('search').value.toLowerCase(),f=document.getElementById('filter').value;grid.innerHTML='';let matches=products.filter(p=>p.available!==false&&(!f||p.category===f)&&(p.title+' '+p.description).toLowerCase().includes(q));for(const p of matches){const card=document.createElement('article');card.className='product';card.innerHTML=`<img loading="lazy" src="${esc(p.image)}" alt="${esc(p.title)}"><div class="content"><div class="category">${esc(p.category)}</div><h2>${esc(p.title)}</h2><p>${esc(p.description)}</p><div class="bottom"><span class="available">● Disponible</span><button class="details">Ver detalles ↗</button></div></div>`;card.querySelector('button').onclick=()=>{document.getElementById('modal').innerHTML=`<div class="modal"><img src="${esc(p.image)}" alt="${esc(p.title)}"><div class="modal-copy"><button class="close">✕</button><div class="category">${esc(p.category)}</div><h2>${esc(p.title)}</h2><p class="muted">${esc(p.description)}</p><p class="available">● Disponible</p><p class="muted">Consulta el precio y las opciones de compra directamente con la tienda.</p></div></div>`;document.querySelector('.close').onclick=()=>dialog.close();dialog.showModal()};grid.appendChild(card)}document.getElementById('empty').hidden=matches.length!==0}document.getElementById('search').oninput=draw;document.getElementById('filter').onchange=draw;dialog.onclick=e=>{if(e.target===dialog)dialog.close()};fetch('data/shop.json').then(r=>r.json()).then(d=>{products=d.products||[];draw()}).catch(()=>{document.getElementById('empty').hidden=false;document.getElementById('empty').textContent='No se pudo cargar el catálogo.'});
</script></body></html>
