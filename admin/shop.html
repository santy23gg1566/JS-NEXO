<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIMÓ | Editar Shop</title><style>body{font:15px system-ui;background:#111;color:white;margin:0;padding:25px;max-width:1000px}a{color:#c9ff63}h1{font-size:38px}article{background:#24262a;padding:18px;border-radius:15px;margin:15px 0;display:grid;grid-template-columns:120px 1fr;gap:18px}img{width:120px;border-radius:10px}label{display:block;margin:10px 0}input,textarea,select{display:block;width:100%;box-sizing:border-box;background:#121316;color:white;border:1px solid #555;border-radius:8px;padding:10px;font:inherit}button{background:#c9ff63;color:#111;border:0;border-radius:10px;padding:12px 20px;font-weight:700;cursor:pointer}small{color:#aaa}@media(max-width:500px){article{grid-template-columns:1fr}img{width:100px}}</style><a href="index.html">← Volver al administrador</a><h1>Editar Shop</h1><p>Modifica los nombres, descripciones, categorías y disponibilidad. Al terminar descarga el JSON y súbelo a <code>data/shop.json</code> en GitHub para publicarlo en Netlify.</p><div id="items"></div><button id="save">Descargar shop.json actualizado</button><script>let data={products:[]};const box=document.getElementById('items');fetch('../data/shop.json').then(r=>r.json()).then(d=>{data=d;render()});function render(){box.innerHTML='';data.products.forEach((p,i)=>{const a=document.createElement('article');const img=document.createElement('img');img.src='../'+p.image;a.appendChild(img);const div=document.createElement('div');for(const [key,label] of [['title','Título'],['description','Descripción'],['category','Categoría']]){const l=document.createElement('label');l.textContent=label;const el=key==='description'?document.createElement('textarea'):document.createElement('input');el.value=p[key]||'';el.oninput=()=>p[key]=el.value;l.appendChild(el);div.appendChild(l)}const l=document.createElement('label');l.textContent='Disponible ';const c=document.createElement('input');c.type='checkbox';c.style.width='auto';c.style.display='inline-block';c.checked=p.available!==false;c.onchange=()=>p.available=c.checked;l.appendChild(c);div.appendChild(l);a.appendChild(div);box.appendChild(a)})}document.getElementById('save').onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='shop.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};</script></html>
